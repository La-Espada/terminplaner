services:
  postgres:
    image: postgres:17-alpine
    container_name: terminplaner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terminplaner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terminplaner_dev}
      POSTGRES_DB: ${POSTGRES_DB:-terminplaner}
      # Zeitzone des Containers auf UTC – die Anwendung rechnet in UTC,
      # die Studio-Zeitzone liegt in der Konfiguration
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-terminplaner}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: terminplaner-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Fängt alle ausgehenden Mails ab, damit lokal nichts echt versendet wird.
  # Oberfläche: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: terminplaner-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  redis-data:
